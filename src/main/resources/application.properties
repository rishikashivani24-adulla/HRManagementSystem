spring.application.name=HRManagementSystem

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hr_management_system
spring.datasource.username=root
spring.datasource.password=MySQL@2026!

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HRManagementHikariPool

# Profiling / Metrics
management.endpoints.web.exposure.include=health,info,metrics